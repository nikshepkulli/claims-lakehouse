name: dbt

# dbt project on DuckDB (ticket #15). Builds against a gold-shaped TEST FIXTURE made from
# claimsgen output (scripts/make_gold_fixture.py), not against Spark gold (#8) or Snowflake.
on:
  pull_request:
    paths:
      - "dbt/**"
      - "scripts/make_gold_fixture.py"
      - "tests/dbt/**"
      - "warehouse/snowflake/01_gold_ddl.sql"
      - "src/claimsgen/**"
      - "requirements-dbt.txt"
      - "requirements-claimsgen.txt"
      - "mk/dbt.mk"
      - ".github/workflows/dbt.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dbt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dbt:
    name: dbt build (duckdb)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DBT_PROFILES_DIR: dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dbt.txt
      - run: pip install -r requirements-dbt.txt
      - name: contract + fixture tests
        run: pytest tests/dbt
      - name: sqlfluff (dbt models)
        working-directory: dbt
        run: sqlfluff lint .
      - name: generate synthetic claims
        run: PYTHONPATH=src python -m claimsgen --rows 5000 --seed 42 --out data/raw
      - name: build gold TEST FIXTURE
        run: python scripts/make_gold_fixture.py --raw data/raw --out data/gold
      - run: cp dbt/profiles.yml.example dbt/profiles.yml
      - run: dbt deps --project-dir dbt
      - run: dbt parse --project-dir dbt --target duckdb
      - name: dbt build (models + tests)
        run: dbt build --project-dir dbt --target duckdb
      - name: source freshness
        run: dbt source freshness --project-dir dbt --target duckdb
      - name: dbt docs generate
        run: dbt docs generate --project-dir dbt --target duckdb
      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            dbt/target/index.html
            dbt/target/manifest.json
            dbt/target/catalog.json
          if-no-files-found: error
