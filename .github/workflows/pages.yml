name: Publish dashboard (GitHub Pages)

# Manual only (workflow_dispatch): never runs on push or pull_request; the owner triggers a
# redeploy by hand. Needs GitHub Pages enabled (Settings > Pages > Source: GitHub Actions).
# The page is built from the synthetic gold TEST FIXTURE (see docs/dashboard.md).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dbt.txt
      - run: pip install -r requirements-dbt.txt -r requirements-quality.txt
      - name: generate synthetic claims and the gold test fixture
        run: |
          PYTHONPATH=src python -m claimsgen --rows 5000 --seed 42 --out data/raw --quiet
          python scripts/make_gold_fixture.py --raw data/raw --out data/gold
      - name: run the gold quality checks on the fixture (Great Expectations)
        # Exit 1 is EXPECTED here: the fixture has no gold_reconciliation / gold_exclusions tables
        # (only Spark gold writes them), so the runner reports them as missing required tables.
        # The page shows that. Exit 2 (usage error) or a missing result file still fails the job.
        run: |
          set +e
          PYTHONPATH=src python -m lakehouse.quality run --layer gold --root data/gold --out data/dq --no-docs
          rc=$?
          set -e
          test "$rc" -le 1
          test -s data/dq/gold-result.json
      - name: sample inputs for the pipeline-runs view (real observability, lineage and quality CLI runs)
        # Spark-free: wraps claimsgen, the gold fixture build and the gold quality check in the
        # observability + lineage wrappers; writes ledger, OpenLineage events, alerts, DQ results.
        run: python -m dashboard.sample --out data/dashboard-sample
      - name: build the dashboard
        run: python -m dashboard.build --gold data/gold --raw data/raw --quality-json data/dq/gold-result.json --out site --lineage-events data/dashboard-sample/lineage/events.jsonl --column-lineage lineage/column_lineage.yaml --runs data/dashboard-sample/ops/pipeline_runs --alerts data/dashboard-sample/ops/alerts.jsonl --quality-history data/dashboard-sample/dq --pipeline-label "sample run from the synthetic fixture"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
