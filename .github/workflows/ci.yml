name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: python lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: make -f mk/quality.mk test

  spark-tests:
    # Legs run in parallel, so wall time is that of the slowest one (Spark on tiny data is
    # dominated by per-job overhead, so silver is split in two). The bronze leg keeps the old
    # check name "spark tests (bronze)".
    name: spark tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: bronze
            path: tests/bronze
          - suite: silver-e2e
            path: tests/silver/test_silver_e2e.py
          - suite: silver-rules
            path: tests/silver/test_silver_rules.py
          - suite: streaming
            path: tests/streaming
          - suite: gold
            path: tests/gold
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-spark.txt
      - run: pip install -r requirements-spark.txt
      - run: pytest -m spark -p no:cacheprovider ${{ matrix.path }}

  pipeline-e2e:
    # claimsgen -> bronze -> silver -> gold (Spark/Delta) -> dbt build on DuckDB, reading the REAL
    # gold Parquet export instead of the dbt test fixture. Any failing dbt test fails the job.
    name: pipeline e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E: data/e2e
      DATASETS: claims,claim_lines,diagnoses,members,providers
      GOLD_E2E_DIR: data/e2e
      DBT_PROFILES_DIR: dbt
      DBT_DUCKDB_PATH: data/e2e/claims.duckdb
      PYTHONPATH: src
      # Gold needs a pseudonymisation key (#71). FAKE, public, test-only: the data is synthetic and
      # the lake is thrown away with the runner. A real key is never put in this file.
      LAKEHOUSE_PSEUDONYM_KEY: GOLD-TESTS-ONLY-NOT-A-SECRET-0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-spark.txt
            requirements-dbt.txt
      - run: pip install -r requirements-spark.txt -r requirements-dbt.txt
      - name: generate synthetic claims (2000 claims, seed 42)
        run: python -m claimsgen --rows 2000 --seed 42 --out $E2E/raw --overwrite --quiet
      - name: merge daily partitions into 3 batches (keeps Spark batch count small)
        run: python scripts/bucket_raw_batches.py --raw $E2E/raw --out $E2E/raw_batched --batches 3
      - name: bronze
        run: python -m lakehouse.bronze --input $E2E/raw_batched --bronze $E2E/bronze --batch-date all --datasets $DATASETS
      - name: silver
        run: python -m lakehouse.silver --bronze $E2E/bronze --silver $E2E/silver --batch-date all --datasets $DATASETS
      - name: gold (reconciliation failures exit non-zero)
        run: python -m lakehouse.gold --silver $E2E/silver --gold $E2E/gold --batch-date all
      - name: dbt build on the real gold export
        run: |
          cp dbt/profiles.yml.example dbt/profiles.yml
          dbt deps --project-dir dbt
          dbt build --project-dir dbt --target duckdb --vars "{gold_path: $E2E/gold/export}"
      - name: end-to-end checks on the real output (reconciliation, quarantine, keys, export)
        run: pytest -m spark -p no:cacheprovider tests/gold/test_gold_pipeline_spark.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pipeline-e2e-dbt-results
          path: dbt/target/run_results.json
          if-no-files-found: ignore

  sqlfluff:
    name: sqlfluff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: sqlfluff lint .

  tf-discover:
    name: discover terraform dirs
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
      any: ${{ steps.find.outputs.any }}
      has_tf: ${{ steps.find.outputs.has_tf }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: .github/scripts/tf-discover.sh

  terraform:
    name: terraform (${{ matrix.dir }})
    needs: tf-discover
    if: needs.tf-discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.tf-discover.outputs.dirs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7
      - run: terraform fmt -check -recursive
        working-directory: ${{ matrix.dir }}
      - run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}
      - run: terraform validate
        working-directory: ${{ matrix.dir }}

  checkov:
    name: checkov (non-blocking)
    needs: tf-discover
    if: needs.tf-discover.outputs.has_tf == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: bridgecrewio/checkov-action@v12.3139.0
        continue-on-error: true
        with:
          directory: infra
          framework: terraform
          soft_fail: true

  terraform-gate:
    name: terraform (gate)
    needs: [tf-discover, terraform]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pass on success, or skipped because there is no terraform; fail if .tf exists but nothing was validated
        env:
          RESULT: ${{ needs.terraform.result }}
          DISCOVER: ${{ needs.tf-discover.result }}
          ANY: ${{ needs.tf-discover.outputs.any }}
          HAS_TF: ${{ needs.tf-discover.outputs.has_tf }}
        run: |
          echo "discover=$DISCOVER terraform=$RESULT any=$ANY has_tf=$HAS_TF"
          [ "$DISCOVER" = "success" ] || { echo "::error::discovery failed"; exit 1; }
          if [ "$HAS_TF" = "true" ] && [ "$ANY" != "true" ]; then
            echo "::error::infra/ has .tf files but none under infra/*/envs/* or infra/*/modules/*; nothing was validated"
            exit 1
          fi
          [ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]

  databricks-bundle:
    # Validates databricks/databricks.yml (dev + prod) with the real Databricks CLI against a local
    # stub of the two workspace calls validate makes, so no account or secret is involved. This
    # checks the bundle's shape only; nothing is deployed or run.
    name: databricks bundle (validate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: databricks/setup-cli@v1.23.0
        with:
          version: 1.24.0
      - run: python databricks/offline_validate.py

  dashboard:
    # Static analytics dashboard (#29): claimsgen -> gold TEST FIXTURE -> dbt marts -> site/index.html.
    # Runs the dashboard tests, builds the page and uploads it as an artifact. No deploy here;
    # publishing is the manual pages.yml workflow.
    name: dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dbt.txt
      - run: pip install -r requirements-dbt.txt
      - name: dashboard tests (builds the page, golden numbers, no external requests, a11y)
        run: pytest tests/dashboard -q
      - name: generate synthetic claims and the gold test fixture
        run: |
          PYTHONPATH=src python -m claimsgen --rows 5000 --seed 42 --out data/raw --quiet
          python scripts/make_gold_fixture.py --raw data/raw --out data/gold
      - name: build the dashboard
        run: python -m dashboard.build --gold data/gold --raw data/raw --out site
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-site
          path: site/index.html
          if-no-files-found: error
