# Feature registry for ticket #26. Generated once from the feature spec, now hand-maintained.
version: 1
feature_set: claim_denial_v1
description: Feature registry (#26). Every column of the three feature tables is listed here; tests/features/test_registry.py fails on drift in either direction. classification/identifier/handling use the vocabulary of governance/data_classification.yaml. NO feature is PHI_LIKE or a direct identifier.
entities:
  member:
    table: member_features
    key: [member_id, as_of]
    as_of: first of month (grid)
  provider:
    table: provider_features
    key: [provider_id, as_of]
    as_of: first of month (grid)
  claim:
    table: claim_features
    key: [claim_id, as_of]
    as_of: start of the claim's receipt day (scoring moment); also carries m_<member feature> and p_<provider feature> columns computed at that as_of
    prefixes: {member: m_, provider: p_}
key_columns:
  member_id: {classification: PHI_LIKE, identifier: direct, handling: hash, note: 'Join key only, never a model input. Hashed/tokenised in analyst views per governance/data_classification.yaml (dim_member.member_id).'}
  provider_id: {classification: CONFIDENTIAL, identifier: direct, handling: hash, note: Join key only (dim_provider.provider_id).}
  claim_id: {classification: CONFIDENTIAL, identifier: quasi, handling: none, note: Join key only (fact_claim.claim_id).}
  as_of: {classification: INTERNAL, identifier: none, handling: none, note: 'Member/provider tables: first of month. Claim table: equals the receipt date (fact_claim.received_date_key is PHI_LIKE quasi), so the claim table inherits that handling; drop as_of before training.'}
label:
  name: is_denied
  table: labels/claim_denial
  entity: claim
  source_columns: [fact_claim.claim_status]
  classification: INTERNAL
  description: Claim was denied. Stored separately from every feature table; joined only by features.training_set().
