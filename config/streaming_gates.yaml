# Streaming data-quality gates (ticket #13), evaluated per micro-batch in foreachBatch.
# Loaded and validated at job startup by src/lakehouse/streaming/gates.py; an invalid file
# stops the job before any query starts. Documented in docs/streaming-spark.md.
#
# A gate breaches when its value is STRICTLY GREATER than the threshold (fail: 0 = any
# occurrence). `null` disables one level; a gate that is absent is not evaluated.
# Rates are fractions in [0, 1] (0.05 = 5%).
#
# These defaults are sized for the synthetic generator stream (~0.1% injected defects) and a
# production-like rule of thumb; tune per topic.
version: 1

# What to do when ANY gate reaches `fail`:
#   halt   - raise DQ_GATE_FAILED from foreachBatch; the query stops, the batch is NOT written,
#            fixing the cause/thresholds and restarting replays the same batch.
#   divert - write the whole batch to the dead-letter table (and topic) and keep running.
on_fail: halt

# Rate gates are skipped for batches smaller than this (a percentage of 3 rows is noise).
min_batch_rows: 20

gates:
  contract_failure_rate: {warn: 0.01, fail: 0.05}   # contract_violation rows / batch rows
  dlq_rate:              {warn: 0.02, fail: 0.10}   # all dead letters / batch rows
  late_rate:             {warn: 0.01, fail: 0.05}   # late events / valid rows
  duplicate_rate:        {warn: 0.10, fail: 0.30}   # duplicates reaching the sink / valid rows
  null_rate:                                        # NULLs per field / parseable rows
    fields:
      claim_id: {warn: 0.0, fail: 0.05}
      amount:   {warn: 0.0, fail: 0.05}
      event_ts: {warn: 0.0, fail: 0.05}
  # Processing time minus the watermark, in seconds. Left unset: replaying historical data (the
  # synthetic files, or a backfill) makes it huge by design. Enable on a live topic, e.g.
  # watermark_lag_seconds: {warn: 21600, fail: 86400}
