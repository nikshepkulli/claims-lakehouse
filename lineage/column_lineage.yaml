# Column-level lineage of the gold star schema (ticket #24).
#
# Hand-written and reviewed: it documents what src/lakehouse/gold/{dims,scd2,facts}.py do.
# `python -m lakehouse.lineage check-mapping` and tests/lineage/test_column_lineage.py fail when
# it drifts: every gold column (warehouse contract: src/lakehouse/gold/schema.py) must be mapped
# here, and every source must exist in the silver contract (quality/expectations/silver.yaml).
#
# Per column give exactly one of:
#   sources: [<layer>.<table>.<column>, ...]   value is computed from these columns
#     transformation: IDENTITY | TRANSFORMATION | AGGREGATION   (default IDENTITY)
#     masking: true        the value hides the source (keyed HMAC token, ticket #71)
#     indirect: [...]      columns that influence the value without being in it (join keys)
#   derived: "text"        no source column (batch metadata, constants, calendar, reference data)
# Derived columns have no OpenLineage input field, so they are absent from the emitted facet.
version: 1
tables:
  dim_date:
    date_key: {derived: "YYYYMMDD of full_date; calendar generated by the gold job"}
    full_date: {derived: "calendar day generated for every year touched by silver claim dates"}
    year: {derived: "calendar attribute of full_date"}
    quarter: {derived: "calendar attribute of full_date"}
    month: {derived: "calendar attribute of full_date"}
    month_name: {derived: "English month name (locale independent)"}
    day_of_month: {derived: "calendar attribute of full_date"}
    day_of_week: {derived: "ISO weekday of full_date"}
    is_weekend: {derived: "ISO weekday >= 6"}

  dim_member:
    member_sk:
      sources: [silver.members.member_id]
      transformation: TRANSFORMATION
      masking: true
      description: "surrogate key = derive_sk('member', HMAC token of member_id)"
    member_id:
      sources: [silver.members.member_id]
      transformation: TRANSFORMATION
      masking: true
      description: "keyed HMAC token tok_<key_id>_<hex> (LAKEHOUSE_PSEUDONYM_KEY); raw id never lands in gold"
    birth_year: {sources: [silver.members.birth_year]}
    sex: {sources: [silver.members.sex]}
    state: {sources: [silver.members.state]}
    plan_type: {sources: [silver.members.plan_type]}
    enrollment_date: {sources: [silver.members.enrollment_date]}
    effective_from: {derived: "SCD2: snapshot batch date, or 1900-01-01 for a key's first version"}
    effective_to: {derived: "SCD2: next version's effective_from, NULL for the current one"}
    is_current: {derived: "SCD2: effective_to IS NULL"}
    record_hash:
      sources:
        - silver.members.birth_year
        - silver.members.sex
        - silver.members.state
        - silver.members.plan_type
        - silver.members.enrollment_date
      transformation: TRANSFORMATION
      description: "SHA-256 over the tracked type-2 attributes"
    load_batch_id: {derived: "batch id of the gold run (bYYYYMMDD)"}
    loaded_at: {derived: "gold run timestamp"}

  dim_provider:
    provider_sk:
      sources: [silver.providers.provider_id]
      transformation: TRANSFORMATION
      masking: true
      description: "surrogate key = derive_sk('provider', HMAC token of provider_id)"
    provider_id:
      sources: [silver.providers.provider_id]
      transformation: TRANSFORMATION
      masking: true
      description: "keyed HMAC token tok_<key_id>_<hex>; raw id never lands in gold"
    specialty: {sources: [silver.providers.specialty]}
    state: {sources: [silver.providers.state]}
    network_status: {sources: [silver.providers.network_status]}
    cost_tier: {sources: [silver.providers.cost_tier]}
    effective_from: {derived: "SCD2: snapshot batch date, or 1900-01-01 for a key's first version"}
    effective_to: {derived: "SCD2: next version's effective_from, NULL for the current one"}
    is_current: {derived: "SCD2: effective_to IS NULL"}
    record_hash:
      sources:
        - silver.providers.specialty
        - silver.providers.state
        - silver.providers.network_status
        - silver.providers.cost_tier
      transformation: TRANSFORMATION
      description: "SHA-256 over the tracked type-2 attributes"
    load_batch_id: {derived: "batch id of the gold run (bYYYYMMDD)"}
    loaded_at: {derived: "gold run timestamp"}

  dim_diagnosis:
    diagnosis_sk:
      sources: [silver.diagnoses.icd10_code]
      transformation: TRANSFORMATION
      description: "surrogate key = derive_sk('diagnosis', icd10_code)"
    icd10_code: {sources: [silver.diagnoses.icd10_code]}
    icd10_chapter:
      sources: [silver.diagnoses.icd10_code]
      transformation: TRANSFORMATION
      description: "leading letter of the ICD-10 code"
    description:
      derived: "reference lookup keyed by icd10_code (claimsgen reference set), default text when unknown"
    load_batch_id: {derived: "batch id of the gold run (bYYYYMMDD)"}
    loaded_at: {derived: "gold run timestamp"}

  fact_claim:
    claim_id: {sources: [silver.claims.claim_id]}
    member_sk:
      sources: [silver.claims.member_id]
      transformation: TRANSFORMATION
      masking: true
      indirect: [silver.claims.service_date, silver.members.member_id]
      description: "member_sk of the dim_member version valid on service_date (token of member_id)"
    provider_sk:
      sources: [silver.claims.provider_id]
      transformation: TRANSFORMATION
      masking: true
      indirect: [silver.claims.service_date, silver.providers.provider_id]
      description: "provider_sk of the dim_provider version valid on service_date"
    primary_diagnosis_sk:
      sources: [silver.diagnoses.icd10_code]
      transformation: TRANSFORMATION
      indirect: [silver.diagnoses.diagnosis_type, silver.diagnoses.dx_seq, silver.diagnoses.claim_id]
      description: "derive_sk('diagnosis', code of the lowest-dx_seq PRIMARY diagnosis of the claim)"
    service_date_key:
      sources: [silver.claims.service_date]
      transformation: TRANSFORMATION
      description: "DATE -> integer YYYYMMDD"
    received_date_key:
      sources: [silver.claims.received_date]
      transformation: TRANSFORMATION
      description: "DATE -> integer YYYYMMDD"
    claim_type: {sources: [silver.claims.claim_type]}
    place_of_service: {sources: [silver.claims.place_of_service]}
    claim_status: {sources: [silver.claims.claim_status]}
    line_count: {sources: [silver.claims.line_count]}
    total_billed_amount:
      sources: [silver.claims.total_billed_amount]
      indirect: [silver.claim_lines.billed_amount]
      description: "header total; a claim is held back from gold if it differs from the sum of its lines"
    total_allowed_amount:
      sources: [silver.claims.total_allowed_amount]
      indirect: [silver.claim_lines.allowed_amount]
      description: "header total; a claim is held back from gold if it differs from the sum of its lines"
    total_paid_amount:
      sources: [silver.claims.total_paid_amount]
      indirect: [silver.claim_lines.paid_amount]
      description: "header total; a claim is held back from gold if it differs from the sum of its lines"
    load_batch_id: {derived: "batch id of the gold run (bYYYYMMDD)"}
    loaded_at: {derived: "gold run timestamp"}

  fact_claim_line:
    line_id: {sources: [silver.claim_lines.line_id]}
    claim_id: {sources: [silver.claim_lines.claim_id]}
    line_number: {sources: [silver.claim_lines.line_number]}
    procedure_code: {sources: [silver.claim_lines.procedure_code]}
    units: {sources: [silver.claim_lines.units]}
    service_date_key:
      sources: [silver.claim_lines.service_date]
      transformation: TRANSFORMATION
      description: "DATE -> integer YYYYMMDD"
    billed_amount: {sources: [silver.claim_lines.billed_amount]}
    allowed_amount: {sources: [silver.claim_lines.allowed_amount]}
    paid_amount: {sources: [silver.claim_lines.paid_amount]}
    load_batch_id: {derived: "batch id of the gold run (bYYYYMMDD)"}
    loaded_at: {derived: "gold run timestamp"}
