name: claims_lakehouse
version: "0.1.0"
config-version: 2
profile: claims_lakehouse

# Layers: staging (1:1 with gold sources, rename/cast), intermediate (joins and
# row-level derivations), marts (consumption grain, contracts enforced).
# See docs/dbt.md for conventions. ALL DATA IS SYNTHETIC.
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
packages-install-path: dbt_packages
target-path: target
clean-targets: ["target", "dbt_packages"]

vars:
  # Fixture data ends in 2024; readmission proxy window in days (see docs/dbt.md)
  readmission_window_days: 30

models:
  claims_lakehouse:
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]
    intermediate:
      +materialized: view
      +schema: staging
      +tags: ["intermediate"]
    marts:
      +materialized: table
      +schema: marts
      +tags: ["marts"]
      +contract:
        enforced: true
