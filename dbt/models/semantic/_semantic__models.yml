version: 2

models:
  - name: metricflow_time_spine
    description: Day-grain time spine for the semantic layer, one row per calendar day (from dim_date).
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: Calendar day.
        granularity: day
        data_tests: [unique, not_null]
