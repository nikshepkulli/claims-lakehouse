[project]
name = "claims-lakehouse"
version = "0.1.0"
description = "Synthetic healthcare-claims lakehouse"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["spark: needs PySpark + Java (run via `make test-spark` or the spark-tests CI job)"]

# Wheel for the Databricks bundle (databricks/databricks.yml, docs/databricks.md). Only the Spark
# job packages ship; PySpark and Delta come from the Databricks runtime, so no dependencies are
# declared here (the local/CI pins live in requirements-*.txt).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lakehouse*", "lakehouse_common*"]
