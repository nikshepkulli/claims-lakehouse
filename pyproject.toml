[project]
name = "claims-lakehouse"
version = "0.1.0"
description = "Synthetic healthcare-claims lakehouse"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["spark: needs PySpark + Java (run via `make test-spark` or the spark-tests CI job)"]
